# =========================================================
# VARIABLES DE ENTORNO - Hyprland
# =========================================================
# Este archivo define variables globales para Wayland,
# GTK, Flatpak y aplicaciones en general.

# ---------------------------------------------------------
# SESIÓN Y ESCRITORIO
# ---------------------------------------------------------

# Define Hyprland como entorno de escritorio activo
env = XDG_CURRENT_DESKTOP,Hyprland

# Fuerza sesión Wayland
env = XDG_SESSION_TYPE,wayland

# ---------------------------------------------------------
# RUTAS DE SISTEMA (GTK / FLATPAK / SHARE)
# ---------------------------------------------------------

# Directorios donde se buscan iconos, themes y recursos
env = XDG_DATA_DIRS,/usr/local/share:/usr/share:/var/lib/flatpak/exports/share:$HOME/.local/share

# ---------------------------------------------------------
# TEMAS (GTK / ICONOS)
# ---------------------------------------------------------

# Tema GTK global (opcional, depende de tu setup)
# env = GTK_THEME,Dracula

# Tema de iconos (puede variar según toolkit)
# env = ICON_THEME,Papirus-Dark
# env = XDG_ICON_THEME,Papirus-Dark

# ---------------------------------------------------------
# CURSOR
# ---------------------------------------------------------

# Tamaño del cursor
env = XCURSOR_SIZE,24

# ---------------------------------------------------------
# (OPCIONAL) QT / APLICACIONES QT
# ---------------------------------------------------------
# Útil si usas apps Qt (KDE, Discord, etc.)
# env = QT_QPA_PLATFORM,wayland
# env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# env = QT_AUTO_SCREEN_SCALE_FACTOR,1